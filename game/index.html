<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy Squad 奇幻小队</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; color: #333; }
.container { max-width: 1100px; margin: 0 auto; padding: 20px; }
.card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); margin-bottom: 20px; }
h1 { text-align: center; color: white; margin-bottom: 20px; font-size: 2.2em; text-shadow: 0 2px 8px rgba(0,0,0,0.3); }
h2 { color: #5a3d8a; margin-bottom: 16px; }
.login-box, .game-box { max-width: 480px; margin: 40px auto; }
input, button, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; }
button { background: #764ba2; color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
button:hover { background: #5a3d8a; }
.chars { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
.char { background: #f8f5ff; border-radius: 12px; padding: 12px; text-align: center; border: 2px solid transparent; transition: 0.2s; }
.char:hover, .char.selected { border-color: #764ba2; transform: translateY(-4px); }
.char img { width: 100%; height: 140px; object-fit: contain; border-radius: 8px; background: #fff; }
.char h3 { margin: 8px 0 4px; }
.points { color: #e74c3c; font-weight: bold; }
.team { display: flex; gap: 12px; flex-wrap: wrap; margin: 16px 0; }
.team-slot { width: 120px; height: 160px; border: 2px dashed #ccc; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: #fafafa; }
.battle-log { background: #f0f0f0; padding: 12px; border-radius: 8px; max-height: 200px; overflow-y: auto; font-size: 14px; margin-top: 12px; }
.hidden { display: none; }
.nav { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.nav button { width: auto; padding: 10px 20px; }
.status { text-align: center; color: white; margin-bottom: 10px; font-size: 1.1em; }
</style>
</head>
<body>
<div class="container">
  <h1>✨ Fantasy Squad 奇幻小队 ✨</h1>
  <div id="status" class="status"></div>

  <!-- 登录 -->
  <div id="loginScreen" class="card login-box">
    <h2>登录 / 注册</h2>
    <input id="username" placeholder="用户名 (4-16位)" maxlength="16">
    <input id="password" type="password" placeholder="密码">
    <button onclick="login()">登录</button>
    <button onclick="register()" style="background:#5a3d8a">注册新账号</button>
    <p style="text-align:center;margin-top:12px;color:#666;font-size:14px">演示版：数据保存在本地浏览器</p>
  </div>

  <!-- 主游戏界面 -->
  <div id="gameScreen" class="hidden">
    <div class="nav">
      <button onclick="showTab('collection')">角色收集</button>
      <button onclick="showTab('team')">编队养成</button>
      <button onclick="showTab('battle')">小队对战</button>
      <button onclick="logout()" style="background:#e74c3c">退出登录</button>
    </div>
    <div id="userInfo" style="color:white;text-align:center;margin-bottom:10px"></div>

    <!-- 收集 -->
    <div id="tab-collection" class="card">
      <h2>我的角色图鉴</h2>
      <p>点击角色查看详情。收集更多角色可提升小队实力！</p>
      <div class="chars" id="charGrid"></div>
    </div>

    <!-- 编队 -->
    <div id="tab-team" class="card hidden">
      <h2>编队与积分养成</h2>
      <p>当前积分：<span id="totalPoints" class="points">0</span></p>
      <p style="margin:8px 0">选择最多 3 名角色组成小队（点击选择/取消）：</p>
      <div class="chars" id="teamSelectGrid"></div>
      <h3 style="margin-top:20px">当前小队</h3>
      <div class="team" id="currentTeam"></div>
      <button onclick="upgradeSelected()">给选中角色加 50 积分</button>
    </div>

    <!-- 对战 -->
    <div id="tab-battle" class="card hidden">
      <h2>小队对战</h2>
      <p>用你的小队挑战电脑对手，胜利获得积分！</p>
      <button onclick="startBattle()">开始自动对战</button>
      <div class="battle-log" id="battleLog">点击开始对战...</div>
    </div>
  </div>
</div>

<script>
const CHARACTERS = [
  { id: 'robot', name: 'Robot 机器人', img: 'robot.jpg', role: '坦克', baseAtk: 40, baseDef: 80, points: 100 },
  { id: 'giant', name: 'Giant 巨人', img: 'giant.jpg', role: '输出', baseAtk: 90, baseDef: 50, points: 100 },
  { id: 'knight', name: 'Knight 骑士', img: 'knight.jpg', role: '均衡', baseAtk: 65, baseDef: 65, points: 100 },
  { id: 'plant', name: 'Plant Creature 植物生物', img: 'plant_creature.jpg', role: '辅助', baseAtk: 45, baseDef: 60, points: 100 },
  { id: 'carrot', name: 'Carrot Monster 胡萝卜怪', img: 'carrot_monster.jpg', role: '刺客', baseAtk: 85, baseDef: 40, points: 100 },
  { id: 'archer', name: 'Archer 弓箭手', img: 'archer.jpg', role: '远程', baseAtk: 75, baseDef: 45, points: 100 }
];

let currentUser = null;
let userData = {};
let selectedTeam = [];

function loadUsers() {
  return JSON.parse(localStorage.getItem('fs_users') || '{}');
}
function saveUsers(users) {
  localStorage.setItem('fs_users', JSON.stringify(users));
}

function register() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  if (u.length < 4) return alert('用户名至少4位');
  const users = loadUsers();
  if (users[u]) return alert('用户名已存在');
  users[u] = { password: p, points: 500, chars: JSON.parse(JSON.stringify(CHARACTERS)), owned: CHARACTERS.map(c=>c.id) };
  saveUsers(users);
  alert('注册成功！请登录');
}

function login() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  const users = loadUsers();
  if (!users[u] || users[u].password !== p) return alert('用户名或密码错误');
  currentUser = u;
  userData = users[u];
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');
  document.getElementById('userInfo').innerHTML = `欢迎回来，<b>${u}</b> ｜ 总积分：<span class="points">${userData.points}</span>`;
  renderChars();
  showTab('collection');
}

function logout() {
  currentUser = null;
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('gameScreen').classList.add('hidden');
}

function showTab(tab) {
  ['collection','team','battle'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('hidden', t !== tab);
  });
  if (tab === 'team') renderTeamSelect();
}

function renderChars() {
  const grid = document.getElementById('charGrid');
  grid.innerHTML = '';
  userData.chars.forEach(c => {
    const div = document.createElement('div');
    div.className = 'char';
    div.innerHTML = `
      <img src="${c.img}" alt="${c.name}">
      <h3>${c.name}</h3>
      <div>${c.role}</div>
      <div class="points">积分: ${c.points}</div>
      <div>攻${c.baseAtk + Math.floor(c.points/20)} 防${c.baseDef + Math.floor(c.points/25)}</div>
    `;
    grid.appendChild(div);
  });
}

function renderTeamSelect() {
  const grid = document.getElementById('teamSelectGrid');
  grid.innerHTML = '';
  userData.chars.forEach(c => {
    const div = document.createElement('div');
    div.className = 'char' + (selectedTeam.includes(c.id) ? ' selected' : '');
    div.onclick = () => toggleTeam(c.id);
    div.innerHTML = `
      <img src="${c.img}" alt="${c.name}">
      <h3>${c.name}</h3>
      <div class="points">${c.points} 积分</div>
    `;
    grid.appendChild(div);
  });
  document.getElementById('totalPoints').textContent = userData.points;
  updateCurrentTeam();
}

function toggleTeam(id) {
  if (selectedTeam.includes(id)) {
    selectedTeam = selectedTeam.filter(x => x !== id);
  } else if (selectedTeam.length < 3) {
    selectedTeam.push(id);
  } else {
    alert('最多选择3名角色');
    return;
  }
  renderTeamSelect();
}

function updateCurrentTeam() {
  const el = document.getElementById('currentTeam');
  el.innerHTML = '';
  selectedTeam.forEach(id => {
    const c = userData.chars.find(x => x.id === id);
    el.innerHTML += `<div class="team-slot"><img src="${c.img}" style="width:100%;height:100%;object-fit:contain"></div>`;
  });
  for (let i = selectedTeam.length; i < 3; i++) {
    el.innerHTML += `<div class="team-slot">空位</div>`;
  }
}

function upgradeSelected() {
  if (selectedTeam.length === 0) return alert('请先选择角色');
  if (userData.points < 50) return alert('积分不足');
  selectedTeam.forEach(id => {
    const c = userData.chars.find(x => x.id === id);
    c.points += 50;
  });
  userData.points -= 50;
  saveCurrent();
  renderTeamSelect();
  renderChars();
  alert('养成成功！');
}

function saveCurrent() {
  const users = loadUsers();
  users[currentUser] = userData;
  saveUsers(users);
  document.getElementById('userInfo').innerHTML = `欢迎回来，<b>${currentUser}</b> ｜ 总积分：<span class="points">${userData.points}</span>`;
}

function startBattle() {
  if (selectedTeam.length === 0) return alert('请先在编队中选择小队');
  const log = document.getElementById('battleLog');
  log.innerHTML = '对战开始！<br>';
  const myPower = selectedTeam.reduce((sum, id) => {
    const c = userData.chars.find(x => x.id === id);
    return sum + c.baseAtk + c.baseDef + c.points;
  }, 0);
  const enemyPower = 300 + Math.floor(Math.random() * 400);
  log.innerHTML += `我方战力：${myPower}<br>敌方战力：${enemyPower}<br>`;
  setTimeout(() => {
    if (myPower > enemyPower) {
      const reward = 30 + Math.floor(Math.random()*40);
      userData.points += reward;
      log.innerHTML += `<b style="color:green">胜利！获得 ${reward} 积分</b>`;
    } else {
      log.innerHTML += `<b style="color:red">失败...再培养一下小队吧</b>`;
    }
    saveCurrent();
    renderChars();
  }, 800);
}

// 初始化
document.getElementById('status').textContent = '欢迎来到奇幻小队！先登录或注册吧～';
</script>
</body>
</html>
